name: spotify-manager

services:
  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "4900:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spotify_manager}
      POSTGRES_USER: ${POSTGRES_USER:-spotify_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spotify_manager}
    ports:
      - "5432:5432"
    volumes:
      - spotify-manager-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: deploy/docker/migrator.Dockerfile
    environment:
      ConnectionStrings__SpotifyManager: Host=postgres;Port=5432;Database=${POSTGRES_DB:-spotify_manager};Username=${POSTGRES_USER:-spotify_manager};Password=${POSTGRES_PASSWORD:-spotify_manager}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SpotifyManager: Host=postgres;Port=5432;Database=${POSTGRES_DB:-spotify_manager};Username=${POSTGRES_USER:-spotify_manager};Password=${POSTGRES_PASSWORD:-spotify_manager}
      Spotify__ClientId: ${SPOTIFY_CLIENT_ID:-}
      Spotify__ClientSecret: ${SPOTIFY_CLIENT_SECRET:-}
      Spotify__RedirectUri: ${SPOTIFY_REDIRECT_URI:-http://localhost:4900/api/v1/auth/spotify/callback}
    ports:
      - "4901:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__SpotifyManager: Host=postgres;Port=5432;Database=${POSTGRES_DB:-spotify_manager};Username=${POSTGRES_USER:-spotify_manager};Password=${POSTGRES_PASSWORD:-spotify_manager}
      Spotify__ClientId: ${SPOTIFY_CLIENT_ID:-}
      Spotify__ClientSecret: ${SPOTIFY_CLIENT_SECRET:-}
      Spotify__RedirectUri: ${SPOTIFY_REDIRECT_URI:-http://localhost:4900/api/v1/auth/spotify/callback}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  spotify-manager-postgres:
